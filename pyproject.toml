[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ruvi-bitnet"
version = "0.1.0"
description = "Vietnamese-Russian Prefix-LM with ternary BitNet weights and an edge inference runtime"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch", "transformers", "tokenizers", "numpy", "tqdm"]

[project.optional-dependencies]
teacher = ["openai", "pydantic>=2"]

[tool.setuptools.packages.find]
include = ["ruvi_bitnet*"]
